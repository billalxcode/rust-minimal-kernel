[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
authors = ["OS Developer <osdev@example.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
# Bootloader utilities from our workspace
bootloader = { path = "../bootloader" }

# Use our own VGA utilities instead of external crates
osdev-utils = { path = "../lib/osdev-utils" }

[[bin]]
name = "kernel"
path = "src/main.rs"
