[workspace]
resolver = "2"
members = [
    "kernel",
    "bootloader",
    "lib/osdev-utils"
]

[workspace.dependencies]
# Common no_std compatible crates
spin = "0.9"
bitflags = "2.0"

[workspace.package]
version = "0.1.0"
authors = ["OS Developer"]
edition = "2021"
license = "MIT"

[profile.dev]
panic = "abort"
lto = true

[profile.release]
panic = "abort"
lto = true
opt-level = 2
codegen-units = 1

# Virtual manifest - no main package
